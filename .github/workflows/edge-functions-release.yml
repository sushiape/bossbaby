name: Edge Function Release

on:
  workflow_call:
    inputs:
      validate:
        description: Validate the Edge Function graph before returning.
        required: false
        default: true
        type: boolean
      deploy:
        description: Deploy validated Edge Functions to production.
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Commit to validate and release.
        required: false
        default: ""
        type: string
      allow_historical_main:
        description: Allow an ordered dispatcher to release an earlier main commit.
        required: false
        default: false
        type: boolean
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_PROJECT_REF:
        required: false
  workflow_dispatch:
    inputs:
      validate:
        description: Validate the Edge Function graph before deployment.
        required: true
        default: true
        type: boolean
      deploy:
        description: Deploy validated Edge Functions to production.
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ inputs.deploy && 'production-release-unit' || format('edge-validation-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: inputs.validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Check formatting
        run: >-
          deno fmt --config backend/supabase/deno.json --check
          backend/supabase/functions
          backend/supabase/tests
      - name: Lint
        run: >-
          deno lint --config backend/supabase/deno.json
          backend/supabase/functions
          backend/supabase/tests
      - name: Type-check function graph
        run: >-
          deno check --config backend/supabase/deno.json
          backend/supabase/functions/you-pick/index.ts
          backend/supabase/functions/waitlist/index.ts
          backend/supabase/functions/staff/index.ts
          backend/supabase/functions/surveys/index.ts
      - name: Run unit tests
        run: >-
          deno test --config backend/supabase/deno.json --allow-env
          backend/supabase/functions
          backend/supabase/tests

  deploy:
    name: Deploy production
    if: >-
      always() &&
      inputs.deploy &&
      (!inputs.validate || needs.validate.result == 'success')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - name: Verify deployable main revision
        env:
          ALLOW_HISTORICAL_MAIN: ${{ inputs.allow_historical_main }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$ALLOW_HISTORICAL_MAIN" == "true" ]]; then
            git merge-base --is-ancestor HEAD origin/main
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          fi
      - name: Require production Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required Production environment secret is unavailable: ${secret_name}" >&2
              exit 1
            fi
          done
      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase --workdir backend functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      - name: Smoke-test You Pick read endpoint
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/you-pick/suggestions?limit=1"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$endpoint" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Edge Function smoke test failed after 12 attempts." >&2
          exit 1
