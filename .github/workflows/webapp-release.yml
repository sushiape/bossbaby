name: Webapp Release

on:
  workflow_call:
    inputs:
      validate:
        description: Validate the webapp before returning.
        required: false
        default: true
        type: boolean
      deploy:
        description: Deploy the validated webapp to Vercel production.
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Commit to validate and release.
        required: false
        default: ""
        type: string
      allow_historical_main:
        description: Allow an ordered dispatcher to release an earlier main commit.
        required: false
        default: false
        type: boolean
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      validate:
        description: Validate the webapp before deployment.
        required: true
        default: true
        type: boolean
      deploy:
        description: Deploy the validated webapp to Vercel production.
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ inputs.deploy && 'production-release-unit' || format('webapp-validation-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: inputs.validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build validation artifact
        if: ${{ !inputs.deploy }}
        run: npm run build

  deploy:
    name: Deploy production
    if: >-
      always() &&
      inputs.deploy &&
      (!inputs.validate || needs.validate.result == 'success')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify deployable main revision
        env:
          ALLOW_HISTORICAL_MAIN: ${{ inputs.allow_historical_main }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$ALLOW_HISTORICAL_MAIN" == "true" ]]; then
            git merge-base --is-ancestor HEAD origin/main
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          fi
      - name: Require production Vercel secrets
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for secret_name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required Production environment secret is unavailable: ${secret_name}" >&2
              exit 1
            fi
          done
      - name: Link production Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Vercel builds this deployment rather than receiving a prebuilt artifact. Web Analytics
      # serves from /_vercel/insights/*, and only Vercel's builder can add those routes to a
      # deployment -- the collector identifies the project by the domain the request arrives on,
      # so there is no endpoint a locally built artifact could point at instead. Building here
      # with `vercel build` and shipping it with `deploy --prebuilt` skips that injection and
      # leaves analytics silently uncollected. This job still owns *when* the deploy happens, so
      # the ordering behind ADR 0007 is unchanged: production-release.yml gates it on database
      # and edge-functions succeeding first.
      - name: Deploy validated revision
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.1.3 deploy --prod --token="$VERCEL_TOKEN"
      - name: Smoke-test production routes
        run: |
          set -euo pipefail
          for route in / /app; do
            passed=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location "https://hibossbaby.com${route}" >/dev/null; then
                passed=true
                break
              fi
              sleep 5
            done
            if [[ "$passed" != "true" ]]; then
              echo "Webapp smoke test failed for ${route}." >&2
              exit 1
            fi
          done
      - name: Smoke-test Web Analytics collection route
        run: |
          set -euo pipefail
          # Vercel injects this route only when it builds the deployment itself. A prebuilt
          # deploy returns 404 here and collects nothing, which is invisible from the site.
          for attempt in {1..12}; do
            content_type="$(curl --silent --show-error --location --output /dev/null \
              --write-out '%{content_type}' \
              "https://www.hibossbaby.com/_vercel/insights/script.js")"
            if [[ "$content_type" == *javascript* ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Web Analytics script did not serve JavaScript; insights routes are missing." >&2
          exit 1
