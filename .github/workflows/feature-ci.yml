name: Feature CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.changes.outputs.validate_database }}
      edge_functions: ${{ steps.changes.outputs.validate_edge_functions }}
      webapp: ${{ steps.changes.outputs.validate_webapp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        name: Classify validation scope
        run: >-
          bash .github/scripts/detect-changes.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          feature

  database:
    name: Database
    if: needs.changes.outputs.database == 'true'
    needs: changes
    uses: ./.github/workflows/database-release.yml
    with:
      deploy: false

  edge-functions:
    name: Edge Functions
    if: needs.changes.outputs.edge_functions == 'true'
    needs: changes
    uses: ./.github/workflows/edge-functions-release.yml
    with:
      deploy: false

  webapp:
    name: Webapp
    if: needs.changes.outputs.webapp == 'true'
    needs: changes
    uses: ./.github/workflows/webapp-release.yml
    with:
      deploy: false

  gate:
    name: Gate
    if: always()
    needs: [changes, database, edge-functions, webapp]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          EDGE_RESULT: ${{ needs.edge-functions.result }}
          WEBAPP_RESULT: ${{ needs.webapp.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          for result in "$DATABASE_RESULT" "$EDGE_RESULT" "$WEBAPP_RESULT"; do
            test "$result" = "success" || test "$result" = "skipped"
          done
