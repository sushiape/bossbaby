name: Feature CI

on:
  pull_request:
    branches: [dev]

concurrency:
  group: feature-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.15
      - run: npm ci
      - run: npm run dev:backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: always()
        run: npm run stop:backend
