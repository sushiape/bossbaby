project_id = "bossbaby"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# Staff password recovery returns to /admin. Without these entries Supabase
# silently falls back to site_url, dropping the recovering staff member on the
# public homepage with a token the page cannot consume.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000/admin",
  "http://127.0.0.1:3000/admin",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.you-pick]
enabled = true
verify_jwt = false
entrypoint = "./functions/you-pick/index.ts"

[functions.waitlist]
enabled = true
verify_jwt = false
entrypoint = "./functions/waitlist/index.ts"

# verify_jwt stays false so the unauthenticated CORS preflight reaches the
# function. Staff authorization is enforced inside it, on the verified JWT.
[functions.staff]
enabled = true
verify_jwt = false
entrypoint = "./functions/staff/index.ts"
