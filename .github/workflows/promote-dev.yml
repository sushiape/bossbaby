name: Promote Dev

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dev-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    name: Exact dev source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require the current remote dev head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "dev"
          git fetch --no-tags origin dev
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_HEAD_SHA" = "$(git rev-parse origin/dev)"

  database:
    name: Database
    needs: source
    uses: ./.github/workflows/database-release.yml
    with:
      deploy: false
      expected_sha: ${{ github.sha }}

  edge-functions:
    name: Edge Functions
    needs: source
    uses: ./.github/workflows/edge-functions-release.yml
    with:
      deploy: false
      expected_sha: ${{ github.sha }}

  webapp:
    name: Webapp
    needs: source
    uses: ./.github/workflows/webapp-release.yml
    with:
      deploy: false
      expected_sha: ${{ github.sha }}

  gate:
    name: Gate
    if: always()
    needs: [source, database, edge-functions, webapp]
    runs-on: ubuntu-latest
    steps:
      - name: Require exact source and full CI
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          EDGE_RESULT: ${{ needs.edge-functions.result }}
          WEBAPP_RESULT: ${{ needs.webapp.result }}
        run: |
          set -euo pipefail
          for result in "$SOURCE_RESULT" "$DATABASE_RESULT" "$EDGE_RESULT" "$WEBAPP_RESULT"; do
            test "$result" = "success"
          done
