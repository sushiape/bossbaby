name: Promote Dev

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dev-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    name: Exact dev source
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.changes.outputs.validate_database }}
      edge_functions: ${{ steps.changes.outputs.validate_edge_functions }}
      webapp: ${{ steps.changes.outputs.validate_webapp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require the current remote dev head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "dev"
          git fetch --no-tags origin dev
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_HEAD_SHA" = "$(git rev-parse origin/dev)"
      - id: changes
        name: Classify validation scope
        run: >-
          bash .github/scripts/detect-changes.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  database:
    name: Database
    if: needs.source.outputs.database == 'true'
    needs: source
    uses: ./.github/workflows/database-release.yml
    with:
      deploy: false
      expected_sha: ${{ github.sha }}

  edge-functions:
    name: Edge Functions
    if: needs.source.outputs.edge_functions == 'true'
    needs: source
    uses: ./.github/workflows/edge-functions-release.yml
    with:
      deploy: false
      expected_sha: ${{ github.sha }}

  webapp:
    name: Webapp
    if: needs.source.outputs.webapp == 'true'
    needs: source
    uses: ./.github/workflows/webapp-release.yml
    with:
      deploy: false
      expected_sha: ${{ github.sha }}

  gate:
    name: Gate
    if: always()
    needs: [source, database, edge-functions, webapp]
    runs-on: ubuntu-latest
    steps:
      - name: Require exact source and every selected validation
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          DATABASE_SELECTED: ${{ needs.source.outputs.database }}
          DATABASE_RESULT: ${{ needs.database.result }}
          EDGE_SELECTED: ${{ needs.source.outputs.edge_functions }}
          EDGE_RESULT: ${{ needs.edge-functions.result }}
          WEBAPP_SELECTED: ${{ needs.source.outputs.webapp }}
          WEBAPP_RESULT: ${{ needs.webapp.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = "success"
          require_expected_result() {
            local selected="$1"
            local result="$2"
            if [[ "$selected" == "true" ]]; then
              test "$result" = "success"
            else
              test "$result" = "skipped"
            fi
          }
          require_expected_result "$DATABASE_SELECTED" "$DATABASE_RESULT"
          require_expected_result "$EDGE_SELECTED" "$EDGE_RESULT"
          require_expected_result "$WEBAPP_SELECTED" "$WEBAPP_RESULT"
